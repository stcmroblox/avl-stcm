<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ecotrans STCM — Fleet Manager</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
  <style>
    :root {
      --bg: #0b1120;
      --panel: #111827;
      --panel-2: #1e293b;
      --panel-3: #0f172a;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #283548;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --accent: #38bdf8;
      --ok: #22c55e;
      --warn: #f59e0b;
      --bad: #ef4444;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .wrap {
      max-width: 1380px;
      width: 100%;
      margin: 0 auto;
      padding: 20px;
      flex: 1 0 auto;
    }

    .header-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .brand h1 {
      margin: 0;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .brand .sub {
      color: var(--muted);
      font-size: 0.88rem;
      margin-top: 3px;
    }

    .top-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .stat-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
    }

    .stat-box .k {
      font-size: 0.76rem;
      text-transform: uppercase;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    .stat-box .v {
      font-size: 1.35rem;
      font-weight: 700;
      margin-top: 4px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .filter-left, .filter-right {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .field-inline {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--panel-3);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 8px;
    }

    .field-inline label {
      font-size: 0.78rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .field-inline select {
      border: none;
      background: transparent;
      padding: 4px 6px;
      font-weight: 600;
      color: var(--accent);
      cursor: pointer;
    }

    .field-inline select option {
      background: var(--panel);
      color: var(--text);
    }

    input, select, button {
      font: inherit;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      padding: 8px 11px;
    }

    input::placeholder { color: var(--muted); }

    button {
      cursor: pointer;
      background: #1f2d42;
      transition: background 0.14s ease, border-color 0.14s ease;
    }

    button:hover:not(:disabled) {
      background: #2b3d59;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    button.btn-primary {
      background: var(--primary);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    button.btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
    }
